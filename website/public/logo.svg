<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="foliage" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b7650"/>
      <stop offset="100%" stop-color="#5c4332"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4956a"/>
      <stop offset="100%" stop-color="#9c6a40"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="32" cy="60" rx="13" ry="1.6" fill="#000" opacity="0.10"/>

  <!-- pot -->
  <rect x="22.5" y="55.3" width="3" height="2.7" rx="0.6" fill="#6f4a30"/>
  <rect x="38.5" y="55.3" width="3" height="2.7" rx="0.6" fill="#6f4a30"/>
  <path d="M21 47.5 L43 47.5 L40.5 56 L23.5 56 Z" fill="url(#pot)"/>
  <rect x="18.5" y="44.8" width="27" height="3.4" rx="1.5" fill="#d2a274"/>
  <line x1="28.7" y1="49.8" x2="28.7" y2="53.6" stroke="#f3dcb6" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="31.8,50.1 35,51.7 31.8,53.3" fill="none" stroke="#f3dcb6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- trunk -->
  <path d="M31.5 48 C31 43 27.5 41 27.5 36 C27.5 32 30.5 30 33 28.5"
        fill="none" stroke="url(#trunk)" stroke-width="5.2" stroke-linecap="round"/>

  <!-- canopy: one cohesive cloud of merged shapes -->
  <g fill="url(#foliage)">
    <circle cx="22" cy="22" r="11.5"/>
    <circle cx="33.5" cy="17.5" r="9"/>
    <circle cx="13" cy="25" r="7.5"/>
    <circle cx="38.5" cy="24.5" r="6.5"/>
    <circle cx="28" cy="27" r="7"/>
  </g>
  <!-- top highlight -->
  <g fill="#86efac" opacity="0.5">
    <circle cx="20" cy="17.5" r="5.5"/>
    <circle cx="29" cy="14" r="4"/>
  </g>
</svg>
