<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to the Bonsai docs</title>
  <link rel="canonical" href="https://danfry1.github.io/bonsai-js/guide/">
  <script>
    (function () {
      var base = '/bonsai-js/';
      var map = {
        'installation': 'guide/install', 'common-tasks': 'guide/',
        'quick-start': 'guide/quick-start', 'core-concepts': 'guide/mental-model',
        'literals': 'language/literals', 'operators': 'language/operators',
        'property-access': 'language/property-access', 'pipes': 'guide/migrating',
        'collections': 'functions/lists', 'templates': 'language/templates',
        'lambdas': 'language/lambdas', 'api-bonsai': 'api/environment',
        'api-evaluate': 'api/environment', 'api-compile': 'api/programs',
        'api-extending': 'api/host-functions', 'api-instance-methods': 'api/environment',
        'api-evaluate-expression': 'api/environment', 'api-errors': 'api/errors',
        'stdlib-strings': 'functions/text', 'stdlib-arrays': 'functions/lists',
        'stdlib-math': 'functions/numbers', 'stdlib-types': 'functions/maps',
        'stdlib-dates': 'functions/time', 'stdlib-all': 'functions/',
        'guide-plugins': 'api/host-functions', 'guide-safety': 'guide/safety',
        'guide-performance': 'guide/performance', 'autocomplete-setup': 'guide/editor-support',
        'autocomplete-api': 'api/service', 'autocomplete-editor': 'guide/editor-support',
        'autocomplete-security': 'guide/editor-support'
      };
      var hash = (location.hash || '').replace('#', '');
      var dest = map[hash] || 'guide/';
      location.replace(base + dest);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./guide/">
</head>
<body>Redirecting to the <a href="./guide/">Bonsai guide</a>…</body>
</html>
