<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting… — Bonsai Docs</title>
  <link rel="canonical" href="https://danfry1.github.io/bonsai-js/guide/">
  <script>
    (function () {
      var base = '/bonsai-js/';
      var map = {
        'installation': 'guide/install', 'common-tasks': 'guide/',
        'quick-start': 'guide/quick-start', 'core-concepts': 'guide/mental-model',
        'literals': 'language/literals', 'operators': 'language/operators',

        'collections': 'language/collections', 'templates': 'language/templates',
        'lambdas': 'language/lambdas', 'api-bonsai': 'api/bonsai',

        'api-extending': 'api/extending', 'api-instance-methods': 'api/instance-methods',
        'api-evaluate-expression': 'api/evaluate-expression', 'api-errors': 'api/errors',
        'stdlib-strings': 'stdlib/strings', 'stdlib-arrays': 'stdlib/arrays',
        'stdlib-math': 'stdlib/math', 'stdlib-types': 'stdlib/types',
        'stdlib-dates': 'stdlib/dates', 'stdlib-all': 'stdlib/all',
        'guide-plugins': 'guide/plugins', 'guide-safety': 'guide/safety',

    })();
