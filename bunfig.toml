[install]
# Supply-chain hardening: refuse npm package versions published more recently
# than this threshold (in seconds). 604800 = 7 days. This is install-time
# defense-in-depth; the primary one-week gate is the Dependabot cooldown,
# which blocks update PRs until a version is at least seven days old.
minimumReleaseAge = 604800
# Temporary exceptions: oxfmt/oxlint were bumped within the 7-day window to adopt
# formatting + type-aware linting. Safe to remove once these versions age past the
# threshold (around 2026-06-09).
minimumReleaseAgeExcludes = [
  "oxfmt",
  "@oxfmt/binding-darwin-arm64",
  "@oxfmt/binding-linux-x64-gnu",
]
