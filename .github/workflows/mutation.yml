name: Mutation

# Mutation testing is a drift detector, not a per-PR gate: it is slow and a
# single surviving mutant rarely warrants blocking a merge. Run it weekly (and
# on demand) so eroding fault detection surfaces without slowing the merge
# queue. Each mutated file is its own job, so the largest (the checker, about
# 3,300 mutants) fits in one runner's time, and each keeps an incremental
# result between runs, so later runs only test mutants in changed code.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  mutation:
    name: Mutation testing (${{ matrix.cohort }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - cohort: values
            file: src/runtime/values.ts
          - cohort: state
            file: src/runtime/state.ts
          - cohort: compiler
            file: src/compile/compiler.ts
          - cohort: builtins
            file: src/functions/builtins.ts
          - cohort: checker
            file: src/check/checker.ts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # The previous run's results for this file. Each run saves under a new
      # key, and the newest one with this prefix is restored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/incremental/${{ matrix.cohort }}.json
          key: mutation-${{ matrix.cohort }}-${{ github.run_id }}
          restore-keys: mutation-${{ matrix.cohort }}-

      - name: Mutation testing
        env:
          FILE: ${{ matrix.file }}
          COHORT: ${{ matrix.cohort }}
        run: >-
          bunx stryker run stryker.config.json
          --mutate "$FILE"
          --incremental --incrementalFile "reports/incremental/$COHORT.json"
          --reporters clear-text,html,json

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.cohort }}
          path: reports/mutation/
          if-no-files-found: ignore
