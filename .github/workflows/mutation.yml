name: Mutation

# Mutation testing is a drift detector, not a per-PR gate: it is slow and a
# single surviving mutant rarely warrants blocking a merge. Run it weekly (and
# on demand) so eroding fault detection surfaces without slowing the merge
# queue. `bun run test:mutation` enforces the break threshold in
# stryker.config.json, so a regression fails this run.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Mutation testing
        run: bun run test:mutation

      - name: Upload mutation report
        # Upload even when the break threshold fails, so survivors are inspectable.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
