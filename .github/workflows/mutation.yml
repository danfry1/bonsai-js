name: Mutation

# Mutation testing is a drift detector, not a per-PR gate: it is slow and a
# single surviving mutant rarely warrants blocking a merge. Run it weekly (and
# on demand) so eroding fault detection surfaces without slowing the merge
# queue. Each cohort has an independent floor and report so a strong score in
# one subsystem cannot conceal a regression in another.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  mutation:
    name: Mutation testing (${{ matrix.cohort }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - cohort: core
            script: test:mutation:core
            report: reports/mutation/
          - cohort: stdlib
            script: test:mutation:stdlib
            report: reports/mutation-stdlib/
          - cohort: async
            script: test:mutation:async
            report: reports/mutation-async/

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Mutation testing
        run: bun run ${{ matrix.script }}

      - name: Upload mutation report
        # Upload even when the break threshold fails, so survivors are inspectable.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ matrix.cohort }}
          path: ${{ matrix.report }}
          if-no-files-found: ignore
