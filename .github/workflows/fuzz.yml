name: Fuzz

# Continuous fuzzing of the sandbox is a drift detector, like mutation testing:
# it generates expressions with random seeds and checks the threat-model
# invariants (no escape, parse robustness, sync/async/compile parity). Run it
# weekly and on demand rather than per PR. A found violation fails the run and
# prints the shrunk counterexample and seed in the log for reproduction.
on:
  schedule:
    - cron: '0 6 * * 4' # Thursdays 06:00 UTC
  workflow_dispatch:
    inputs:
      budgetMs:
        description: Fuzzing time budget in milliseconds
        required: false
        default: '180000'

permissions: read-all

jobs:
  fuzz:
    name: Fuzz the sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Fuzz
        env:
          FUZZ_MS: ${{ github.event.inputs.budgetMs || '180000' }}
        run: bun run fuzz "$FUZZ_MS"
