name: Fuzz

# Continuous fuzzing of the sandbox is a drift detector, like mutation testing:
# it generates expressions with random seeds and checks the threat-model
# invariants (no escape, parse robustness, sync/async/compile parity, and static
# checker/schema safety without extension execution). Run it weekly and on
# demand rather than per PR. A found violation fails the run and prints the
# shrunk counterexample and seed in the log for reproduction.
on:
  schedule:
    - cron: '0 6 * * 4' # Thursdays 06:00 UTC
  workflow_dispatch:
    inputs:
      budgetMs:
        description: Fuzzing time budget in milliseconds
        required: false
        default: '180000'

permissions: read-all

jobs:
  fuzz:
    name: Fuzz the sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Fuzz
        env:
          FUZZ_MS: ${{ github.event.inputs.budgetMs || '180000' }}
        run: bun run fuzz "$FUZZ_MS"
