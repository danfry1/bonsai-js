name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'danfry1/bonsai-js'

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Put the lockfile-pinned npm (a devDependency, integrity-checked by bun
      # install) ahead of the runner's bundled npm for the rest of the job.
      - name: Use repo-pinned npm
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Performance gate
        run: bun run bench:gate

      - name: Packed package smoke test
        run: bun run check:package

      - name: Check package exports
        run: |
          npm pack --ignore-scripts --pack-destination /tmp
          bunx attw /tmp/bonsai-js-*.tgz --ignore-rules no-resolution cjs-resolves-to-esm

      - name: Stage publish to npm
        # Uploads the tarball to npm's stage queue. Provenance is auto-generated
        # via OIDC trusted publishing. The version is NOT installable until a
        # maintainer approves it with a 2FA challenge:
        #   npm stage approve <id>   (or approve on npmjs.com)
        run: npm stage publish

      - name: Staged-publish approval reminder
        run: echo "::notice::Version staged to npm. Approve it (npm stage approve <id>, or on npmjs.com) with 2FA to make it installable."

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --generate-notes
