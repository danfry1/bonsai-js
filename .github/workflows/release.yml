name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'danfry1/bonsai-js'

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Put the lockfile-pinned npm (a devDependency, integrity-checked by bun
      # install) ahead of the runner's bundled npm for the rest of the job.
      - name: Use repo-pinned npm
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # GHSA-ch52-4w7c-c8xp (http-cache-semantics) and GHSA-rfgv-xxqx-mfg5 (undici) are
      # bundled inside the npm package, which only the release job uses to publish;
      # overrides cannot reach bundled code. Remove these once npm ships fixed versions.
      - name: Audit dependencies
        run: bun audit --audit-level=high --ignore GHSA-ch52-4w7c-c8xp --ignore GHSA-rfgv-xxqx-mfg5

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Dead code (knip)
        run: bun run knip

      - name: Typecheck
        run: bun run typecheck

      # Runs every documentation example and compares it with its stated result.
      - name: Documentation examples
        run: bun run check:docs

      # test:coverage rather than test: a tag can be cut from a commit that
      # never went through the pull-request gate, so the release gate enforces
      # the same coverage floors CI does.
      - name: Test
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Performance gate
        run: bun run bench:gate

      - name: Packed package smoke test
        run: bun run check:package

      - name: Check package exports
        run: |
          npm pack --ignore-scripts --pack-destination /tmp
          bun run attw /tmp/bonsai-js-*.tgz --ignore-rules no-resolution cjs-resolves-to-esm

      # The tag must name the version being published. Prerelease versions
      # (1.0.0-rc.1) go to the `next` dist-tag so `latest` stays on the last
      # stable release; npm refuses to publish a prerelease without a tag.
      - name: Release channel
        id: channel
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG_NAME" != "v$version" ]; then
            echo "::error::Tag $TAG_NAME does not match package.json version $version"
            exit 1
          fi
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Stage publish to npm
        # Uploads the tarball to npm's stage queue. Provenance is auto-generated
        # via OIDC trusted publishing. The version is NOT installable until a
        # maintainer approves it with a 2FA challenge:
        #   npm stage approve <id>   (or approve on npmjs.com)
        env:
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: npm stage publish --tag "$DIST_TAG"

      - name: Staged-publish approval reminder
        run: echo "::notice::Version staged to npm. Approve it (npm stage approve <id>, or on npmjs.com) with 2FA to make it installable."

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: gh release create "$TAG_NAME" --generate-notes --prerelease="$PRERELEASE"
