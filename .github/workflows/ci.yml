name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # bumpy check diffs against the base branch, so it needs history
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      # bun run resolves the lockfile-pinned binary and fails if it is absent;
      # bunx would fall back to fetching the latest version from the registry.
      - name: Bump file
        run: bun run check:bump --strict

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Dead code (knip)
        run: bun run knip

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Performance gate
        run: bun run bench:gate

      # Absolute floors only catch catastrophic slowdowns; this runs the same
      # cases against the PR's base commit on the same runner and fails on a
      # relative drop, which is what actually catches a regression.
      - name: Performance regression vs base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun run bench:compare "origin/$BASE_REF"

      - name: Check package exports
        run: |
          npm pack --ignore-scripts --pack-destination /tmp
          bun run attw /tmp/bonsai-js-*.tgz --ignore-rules no-resolution cjs-resolves-to-esm

  node-compat:
    name: Node 24 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Packed package smoke test
        run: bun run check:package
