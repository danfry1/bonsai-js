name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit
        continue-on-error: true

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Dead code (knip)
        run: bun run knip

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Performance gate
        run: bun run bench:gate

      - name: Check package exports
        run: |
          npm pack --ignore-scripts --pack-destination /tmp
          bunx attw /tmp/bonsai-js-*.tgz --ignore-rules no-resolution cjs-resolves-to-esm

  node-compat:
    name: Node ${{ matrix.node-version }} smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: bun install --frozen-lockfile

      - name: Packed package smoke test
        run: bun run check:package
