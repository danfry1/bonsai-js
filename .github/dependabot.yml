version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    ignore:
      # Keep @types/node on the major matching engines.node (>=22). A higher
      # major would let the type-checker accept Node APIs newer than our floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # npm publishes releases (npm pack, npm stage publish in release.yml), and a
      # staged publish cannot be rehearsed without releasing. Take its majors
      # deliberately, alongside a release, rather than from a weekly update.
      - dependency-name: "npm"
        update-types: ["version-update:semver-major"]
      # Vitest 5 skips tests inside describe blocks during Stryker's mutant runs
      # (stryker-js#6265), so every mutant survives. Remove these once
      # @stryker-mutator/vitest-runner 10.1.1 or later is adopted with vitest 5.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
