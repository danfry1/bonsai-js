pre-commit:
  parallel: true
  jobs:
    - name: format
      run: bun run format:check
    - name: lint
      run: bun run lint
    - name: typecheck
      run: bun run typecheck

pre-push:
  jobs:
    - name: test
      run: bun run test
    - name: bump-file
      run: bunx bumpy check --hook pre-push --no-fail
